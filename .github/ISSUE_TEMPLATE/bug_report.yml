name: Bug report
description: Report a reproducible PlanSeal defect using synthetic data
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach real plans, state, credentials, or private infrastructure metadata.
  - type: input
    id: version
    attributes:
      label: PlanSeal version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
