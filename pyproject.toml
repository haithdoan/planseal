[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "planseal"
version = "0.1.0" # x-release-please-version
description = "Cryptographic approval for saved infrastructure plans"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Hai Doan" }]
keywords = ["terraform", "opentofu", "infrastructure", "approval", "ai-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]
dependencies = ["cryptography>=45.0.0"]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[project.scripts]
planseal = "planseal.cli:main"

[project.urls]
Homepage = "https://github.com/haithdoan/planseal"
Documentation = "https://github.com/haithdoan/planseal/tree/main/docs"
Issues = "https://github.com/haithdoan/planseal/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/planseal"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["planseal"]
omit = ["src/planseal/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["planseal"]
